name: title

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: read

jobs:
  check-title:
    runs-on: ubuntu-latest
    steps:
      - uses: holoviz-dev/holoviz_tasks/validate-pr-title@0d2b48d28d94714bf566148cd050233ec875a92d # v1.0.13
        with:
          title: ${{ github.event.pull_request.title }}
          types: |
            build
            chore
            ci
            compat
            docs
            enh
            feat
            fix
            perf
            refactor
            test
            type
          scopes: |
            bot
            dev
            data
            plotting
            bokeh
            matplotlib
            plotly
            notebook
