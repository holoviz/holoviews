name: downstream_tests

on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [packages]
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  downstream_tests:
    name: Run downstream tests
    runs-on: ubuntu-latest
    if: ${{ (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') || github.event_name == 'workflow_dispatch' }}
    strategy:
      matrix:
        downstream_repo: [hvplot, geoviews]
      fail-fast: false
    steps:
      - uses: holoviz-dev/holoviz_tasks/downstream-tests@0d2b48d28d94714bf566148cd050233ec875a92d # v1.0.13
        with:
          downstream_repo: ${{ matrix.downstream_repo }}
          github_token: ${{ secrets.ACCESS_TOKEN }}
