name: docs
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+a[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+b[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
  workflow_dispatch:
    inputs:
      target:
        description: "Site to build and deploy, or dry-run"
        type: choice
        options:
          - dev
          - main
          - dryrun
        required: true
        default: dryrun
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions: {}

jobs:
  setup:
    name: setup
    runs-on: ubuntu-latest
    permissions:
      checks: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: check if docs should be built
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'run-docs-ci') }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            run=true reason="not a pull request"
          elif [ "$HAS_LABEL" != true ]; then
            run=false reason="no run-docs-ci label"
          elif [ "$ACTION" != labeled ] || [ "$LABEL" = run-docs-ci ]; then
            run=true reason="run-docs-ci label"
          else
            # This run hides the earlier run's checks, so only skip if the docs already built for this commit
            passed=$(gh api "repos/$GH_REPO/commits/$HEAD_SHA/check-runs?per_page=100" --jq '
              [.check_runs[] | select(.name == "build:docs" and .conclusion != "skipped")]
              | group_by(.name) | map(sort_by(.started_at) | last | .conclusion) == ["success"]')
            if [ "$passed" = true ]; then
              run=false reason="docs already built for $HEAD_SHA"
            else
              run=true reason="no successful docs build for $HEAD_SHA"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Build docs: $run ($reason)" >> "$GITHUB_STEP_SUMMARY"

  docs_build:
    name: build:docs
    needs: [setup]
    if: needs.setup.outputs.run == 'true'
    concurrency:
      group: ${{ github.workflow }}-docs_build-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: "macos-latest"
    timeout-minutes: 180
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: holoviz-dev/holoviz_tasks/pixi-install@ba69594cc0818936bdf628134c86267016a4ef6d # v1.0.8
        with:
          environments: docs
      - name: Build documentation
        run: pixi run -e docs docs-build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: docs
          if-no-files-found: error
          path: builtdocs

  docs_publish:
    name: publish:docs
    runs-on: "ubuntu-latest"
    needs: [docs_build]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs
          path: builtdocs/
      - name: upload dev
        if: |
          (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'dev') ||
          (github.event_name == 'push' && (contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc')))
        run: |
          aws s3 sync --delete ./builtdocs s3://dev.holoviews.org/
          aws cloudfront create-invalidation --distribution-id E3UIBUSHJOO6WO --paths "/*"
      - name: upload main
        if: |
          (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'main') ||
          (github.event_name == 'push' && !(contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc')))
        run: |
          aws s3 sync --delete ./builtdocs s3://holoviews.org/
          aws cloudfront create-invalidation --distribution-id E1UJPEXJIGBZWN --paths "/*"

  result_docs_build:
    name: result:docs
    needs: [setup, docs_build, docs_publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: check for failures
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: echo job failed && exit 1
