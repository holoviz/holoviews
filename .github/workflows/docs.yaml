name: docs
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+a[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+b[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
  workflow_dispatch:
    inputs:
      target:
        description: "Site to build and deploy, or dry-run"
        type: choice
        options:
          - dev
          - main
          - dryrun
        required: true
        default: dryrun
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions: {}

jobs:
  setup:
    name: setup:docs
    runs-on: ubuntu-latest
    permissions:
      checks: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: check if docs should be built
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HAS_LABEL: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-docs-ci') }}
          OTHER_LABEL: ${{ github.event.action == 'labeled' && github.event.label.name != 'run-docs-ci' }}
        run: |
          run=$HAS_LABEL
          if [ "$run" = true ] && [ "$OTHER_LABEL" = true ]; then
            # This run hides the earlier run's checks, so only skip if the docs already built for this commit
            built=$(gh api "repos/$GH_REPO/commits/$HEAD_SHA/check-runs?check_name=build:docs" \
              --jq '[.check_runs[] | select(.conclusion != "skipped")] | max_by(.started_at).conclusion == "success"')
            [ "$built" = true ] && run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  docs_build:
    name: build:docs
    needs: [setup]
    if: needs.setup.outputs.run == 'true'
    concurrency:
      group: ${{ github.workflow }}-docs_build-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: "macos-latest"
    timeout-minutes: 180
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: holoviz-dev/holoviz_tasks/pixi-install@ba69594cc0818936bdf628134c86267016a4ef6d # v1.0.8
        with:
          environments: docs
      - name: Build documentation
        run: pixi run -e docs docs-build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: docs
          if-no-files-found: error
          path: builtdocs

  docs_publish:
    name: publish:docs
    runs-on: "ubuntu-latest"
    needs: [docs_build]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs
          path: builtdocs/
      - name: upload dev
        if: |
          (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'dev') ||
          (github.event_name == 'push' && (contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc')))
        run: |
          aws s3 sync --delete ./builtdocs s3://dev.holoviews.org/
          aws cloudfront create-invalidation --distribution-id E3UIBUSHJOO6WO --paths "/*"
      - name: upload main
        if: |
          (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'main') ||
          (github.event_name == 'push' && !(contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc')))
        run: |
          aws s3 sync --delete ./builtdocs s3://holoviews.org/
          aws cloudfront create-invalidation --distribution-id E1UJPEXJIGBZWN --paths "/*"

  result_docs_build:
    name: result:docs
    needs: [setup, docs_build, docs_publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: check for failures
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: echo job failed && exit 1
