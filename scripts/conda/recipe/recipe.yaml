context:
  name: holoviews
  version: ${{ env.get("VERSION") }}
  python_min: "3.12"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  path: ../../../dist/${{ name }}-${{ version }}.tar.gz

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install --no-deps --no-build-isolation -vv .
  python:
    entry_points:
      - holoviews = holoviews.util.command:main

requirements:
  host:
    - python >=${{ python_min }}
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - bokeh >=3.1
    - colorcet
    - narwhals >=2
    - numpy >=1.21
    - pandas >=1.3
    - panel >=1.0
    - param >=2.0,<3.0
    - python-dateutil >=2.8.2
    - pyviz_comms >=2.1
    - matplotlib-base >=3

tests:
  - python:
      imports:
        - ${{ name }}
      pip_check: true

about:
  homepage: https://holoviews.org
  summary: Stop plotting your data - annotate your data and let it visualize itself.
  license: BSD-3-Clause
